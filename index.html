<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <!-- viewport-fit=cover lets the bottom nav sit against the iOS safe area -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Custom-scored redraft analytics for the UK-BG and O.J. Invitational ESPN leagues."
    />
    <meta name="theme-color" content="#1a1a19" />

    <!--
      Installable. The manifest is what Android and desktop Chrome read: without
      it the app is not installable at all there, however many Apple meta tags
      are present. Relative URLs inside it resolve against the manifest's own
      location, which keeps it working from a project page, a user page or disk —
      the same reason the bundle uses a relative base.
    -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- iOS reads none of the above, so it keeps its own set. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Redraft" />

    <!--
      League data is same-origin static JSON; the only cross-origin requests are
      ESPN's image CDN and the redraft trade market, so those are warmed.
    -->
    <link rel="preconnect" href="https://a.espncdn.com" />
    <link rel="preconnect" href="https://api.fantasycalc.com" crossorigin />

    <title>Redraft — ESPN League Analytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
