<!--
  Maskable launcher icon.

  Android crops a launcher icon to whatever shape the platform theme uses — a
  circle, a squircle, a rounded square — so an icon drawn edge to edge loses its
  corners. The spec reserves the inner 80% circle as the safe zone; the mark here
  fills about half the canvas and is centred, which keeps it whole under every
  mask while still reading at 48px.

  The plain (unmasked) icon stays favicon.svg — same mark on a rounded tile,
  which is what a browser tab and the iOS home screen want.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#d0241c"/>
  <g transform="translate(256 256) rotate(-35) scale(6.2) translate(-24 -24)">
    <path d="M6.5 24Q24 5.5 41.5 24Q24 42.5 6.5 24Z" fill="#fff"/>
    <path d="M17 24h14" stroke="#d0241c" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M19.5 21.4v5.2M22.5 21.2v5.6M25.5 21.2v5.6M28.5 21.4v5.2" stroke="#d0241c" stroke-width="1.9" stroke-linecap="round"/>
  </g>
</svg>
